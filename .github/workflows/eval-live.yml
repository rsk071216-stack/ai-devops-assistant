name: Eval (live model)

# MANUAL ONLY. Runs the same golden dataset through a real model so you can measure it yourself.
# Requires the repository secret ANTHROPIC_API_KEY (optional; the workflow exits cleanly without it).
# Results are written to the job summary and are NOT committed or quoted anywhere in this repository.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id
        default: claude-sonnet-5-5
        type: string
      max_cases:
        description: Maximum number of cases to run
        default: "20"
        type: string
      max_total_cost_usd:
        description: Stop once this much has been spent (estimate)
        default: "1.00"
        type: string

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model }}
      MAX_CASES: ${{ inputs.max_cases }}
      MAX_COST: ${{ inputs.max_total_cost_usd }}
    steps:
      - name: Check for an API key
        id: key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No ANTHROPIC_API_KEY secret configured: skipping the live eval." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: steps.key.outputs.present == 'true'
        with:
          version: "0.13.0"
          python-version: "3.12"
      - name: Run the live eval
        if: steps.key.outputs.present == 'true'
        run: |
          uv sync --frozen
          uv run --frozen aida eval --mode live --provider anthropic --model "${MODEL}" \
            --max-cases "${MAX_CASES}" --max-total-cost-usd "${MAX_COST}" --summary-file "$GITHUB_STEP_SUMMARY"
