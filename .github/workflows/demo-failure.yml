name: Demo failure

# A DELIBERATELY failing workflow. It only runs when started by hand (never on push or PR), so CI on
# push stays green. Its failure is then triaged by .github/workflows/triage-example.yml using the
# action in this repository, in rules-only mode (no API key involved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-staging (fails on purpose)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy (DATABASE_URL is intentionally not configured)
        run: |
          # A fake, runtime-assembled key id shows that redaction happens before anything is posted.
          AWS_ACCESS_KEY_ID="AKIA$(printf 'QWERTY12%.0s' 1 2)"
          export AWS_ACCESS_KEY_ID
          bash demo/deploy.sh
